<div class="card mt-4">
  <div class="card-header"><h3>Детали контакта</h3></div>
  <div class="card-body">
    <h4>{{ contact._id ? 'Редактирование контакта' : 'Новый контакт' }}</h4>
    <div class="mb-3">
      <label class="form-label"> Имя </label>
      <input class="form-control" [(ngModel)]="contact.username" type="text" />
    </div>
    <div class="mb-3">
      <label class="form-label"> Электронная почта </label>
      <input class="form-control" [(ngModel)]="contact.email" type="email" />
    </div>
    <div class="mb-3">
      <label class="form-label"> Мобильный телефон </label>
      <input class="form-control" [(ngModel)]="contact.telephone.mobile" type="text" />
    </div>
    <div class="mb-3">
      <label class="form-label"> Рабочий телефон </label>
      <input class="form-control" [(ngModel)]="contact.telephone.home" type="text" />
    </div>
    <button *ngIf="!contact._id" class="btn btn-success me-2" (click)="createContact(contact)">
      Создать контакт
    </button>
    <button *ngIf="contact._id" class="btn btn-primary me-2" (click)="updateContact(contact)">
      Обновить контакт
    </button>
    <button *ngIf="contact._id" class="btn btn-danger" (click)="deleteContact(contact._id!)">
      Удалить контакт
    </button>
  </div>
</div>
